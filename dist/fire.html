<html lang="en">
<head>

<title>Campfire — WebGPU</title>
<style>

       text-shadow: 0 1px 2px #000a; pointer-events: none; user-select: none; }

         backdrop-filter: blur(6px); border: 1px solid #ffffff18; }

#nav a.on { background: #e2a04e; color: #1a1208; border-color: #e2a04e; font-weight: 600; }

         background: #0b0f14c8; backdrop-filter: blur(6px); color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif;
         max-height: calc(100% - 40px); overflow: auto; }

<script type="module">
// js/engine/gpu.js
var GU = GPUBufferUsage;

var HDR = "rgba16float";
var DEPTH = "depth32float";

  console.log(msg);
  try {
    fetch("/__log", { method: "POST", body: String(msg) }).catch(() => {
    });
  } catch (e) {
  }
}
function fail(msg) {
  const el = document.getElementById("err");
  if (el) {
    el.style.display = "block";
    el.textContent = msg;
  }

async function initGPU(canvas) {
  if (!navigator.gpu) fail("WebGPU is not available in this browser. Use a recent Chrome.");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) fail("No WebGPU adapter found.");
  const hasTS = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({
    requiredFeatures: hasTS ? ["timestamp-query"] : [],
    requiredLimits: {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, 1 << 30),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, 1 << 30),
      maxStorageTexturesPerShaderStage: Math.min(adapter.limits.maxStorageTexturesPerShaderStage, 8)
    }
  });
  device.lost.then((i) => log("device lost: " + i.message));
  device.onuncapturederror = (e) => log("GPU error: " + e.error.message);
  const ctx = canvas.getContext("webgpu");
  const swapFormat = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: swapFormat, alphaMode: "opaque", usage: TU.RENDER_ATTACHMENT | TU.COPY_SRC });
  return { adapter, device, ctx, swapFormat, hasTS };

  async function shader(code, label) {
    const m = device.createShaderModule({ code, label });
    const info = await m.getCompilationInfo();
    let bad = false;
    for (const msg of info.messages) {
      if (msg.type === "error") bad = true;
      if (msg.type !== "info") {
        const line = code.split("\n")[msg.lineNum - 1];
        log(`[${label}] ${msg.type} ${msg.lineNum}:${msg.linePos} ${msg.message}
    ${line}`);

    return m;

    label,
    layout: pipe.getBindGroupLayout(group),
    entries: entries.map((r, i) => ({ binding: i, resource: r }))

  const bufFrom = (data, usage, label) => {
    const b = device.createBuffer({ size: Math.ceil(data.byteLength / 4) * 4, usage: usage | GU.COPY_DST, label });
    device.queue.writeBuffer(b, 0, data);
    return b;
  };

}

var CAM_WGSL = (

var BLOOM_DOWN = FULLSCREEN_VS + /* wgsl */
`

var BLOOM_UP = FULLSCREEN_VS + /* wgsl */
`
struct P { texel: vec4f };   // xy = 1/src size, z = radius, w = weight

function mat4Mul(out, a, b) {

    out[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;

  amb: vec4f,        // rgb ambient, w ember amount

@group(0) @binding(2) var noiseT: texture_3d<f32>;

fn nz(p: vec3f) -> vec4f { return textureSampleLevel(noiseT, nsamp, p, 0.0); }

fn groundH(x: f32, z: f32) -> f32 {
  let r = length(vec2f(x, z));
  let h = 0.5 * (sin(x * 0.07 + 1.3) * cos(z * 0.055) + 0.5 * sin(x * 0.13 + z * 0.11 + 2.0));
  return h * smoothstep(3.0, 10.0, r);
}

// black-body-ish flame ramp, T in 0..1 -> linear radiance colour (unit brightness)
fn flameRamp(T: f32) -> vec3f {
  let t = clamp(T, 0.0, 1.0);
  var c = mix(vec3f(0.0), vec3f(0.55, 0.03, 0.0), smoothstep(0.0, 0.18, t));
  c = mix(c, vec3f(1.0, 0.16, 0.015), smoothstep(0.12, 0.38, t));
  c = mix(c, vec3f(1.0, 0.42, 0.05), smoothstep(0.32, 0.58, t));
  c = mix(c, vec3f(1.0, 0.72, 0.22), smoothstep(0.52, 0.80, t));
  c = mix(c, vec3f(1.0, 0.93, 0.68), smoothstep(0.76, 1.0, t));
  return c;
}

fn sphShadow(p: vec3f, L: vec3f, c: vec3f, r: f32) -> f32 {
  let d = L - p;
  let len2 = dot(d, d);
  let t = clamp(dot(c - p, d) / len2, 0.0, 1.0);
  let dist = length(p + d * t - c);
  let pen = clamp(0.28 * t / max(1.0 - t, 0.05), 0.03, 0.5);
  return smoothstep(r - pen, r + pen, dist);
}
fn fireShadow(p: vec3f) -> f32 {

  let d = L - p;
  if (dot(d, d) > 64.0) { return 1.0; }
  var s = 1.0;
  for (var i = 0; i < 24; i++) {
    let b = scn.blk[i];
    if (b.w > 0.0) { s *= sphShadow(p, L, b.xyz, b.w); }
  }
  return s;
}
fn fireIrr(p: vec3f, n: vec3f) -> vec3f {

  let l = d * inverseSqrt(r2);

fn skyBase(rd: vec3f) -> vec3f {

  let sunDir = normalize(vec3f(0.35, -0.10, -0.93));

fn fireScatter(ro: vec3f, rd: vec3f, tmax: f32) -> vec3f {
  let oc = scn.light.xyz - ro;
  let tc = dot(oc, rd);
  let h = max(length(oc - rd * tc), 0.35);
  let integral = (atan((tmax - tc) / h) - atan(-tc / h)) / h;
  return scn.lightCol.rgb * scn.light.w * integral * scn.env.y * 0.00042;

fn applyFog(col: vec3f, wp: vec3f) -> vec3f {
  let ro = cam.pos.xyz;

  return mix(col, fogC, fogA) + fireScatter(ro, rd, d);
}

  /* wgsl */

${FIRE_COMMON}

struct SO { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) wp: vec3f, @location(2) k: f32, @location(3) seed: f32 };
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> SO {

  var o: SO;

  let life = pt.vel.w;

  let rgt = normalize(cam.right.xyz);
  let upv = normalize(cam.up.xyz);

  /* wgsl */
  `
${FIRE_COMMON}
struct FO { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) b: f32 };
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> FO {
  var q = array<vec2f, 6>(vec2f(-1, -1), vec2f(1, -1), vec2f(1, 1), vec2f(-1, -1), vec2f(1, 1), vec2f(-1, 1));
  let f = f32(ii);
  let h = hash13(vec3f(f, 1.7, 3.1));
  let h2 = hash33(vec3f(f * 0.37, 5.0, 9.0));
  let t = cam.pos.w;
  let ang = h2.x * TAU;
  let rad = 4.5 + 26.0 * sqrt(h2.y);
  var p = vec3f(cos(ang) * rad + sin(t * 0.31 * (0.5 + h) + h * 40.0) * 1.6, 0.0, sin(ang) * rad + cos(t * 0.27 * (0.6 + h2.z) + h * 20.0) * 1.6);
  p.y = groundH(p.x, p.z) + 0.5 + 1.6 * h2.z + sin(t * 0.5 + h * 30.0) * 0.3;
  let ph = sin(t * (0.45 + 0.4 * h) + h * 70.0) * 0.5 + 0.5;
  let blink = pow(smoothstep(0.55, 1.0, ph), 2.0) * (0.35 + 0.65 * scn.env.x);
  var o: FO;
  let rgt = normalize(cam.right.xyz);
  let upv = normalize(cam.up.xyz);
  let w = p + (rgt * q[vi].x + upv * q[vi].y) * 0.05;
  o.pos = cam.viewProj * vec4f(w - cam.pos.xyz, 1.0);
  o.uv = q[vi];
  o.b = blink;
  return o;
}
@fragment fn fs(in: FO) -> @location(0) vec4f {
  let d2 = dot(in.uv, in.uv);
  let g = exp(-d2 * 7.0) + exp(-d2 * 1.6) * 0.1;
  return vec4f(vec3f(0.55, 1.0, 0.22) * 9.0 * g * in.b, 1.0);
}
`
);

// js/scenes/fire/main.js
var NOISE_RES = 128;
var MAX_GRASS = 2e5;
var N_SPARK = 2200;
var N_BLOB = 900;
var N_SMOKE = 2400;
var N_FLY = 220;

  const heightF = Math.min(1.3, Math.max(0.7, 0.92 + 0.28 * vn(t * 1.4 + 3) + 0.14 * (2 * vn(t * 5.7 + 9) - 1)));
  const wMag = P.wind * (0.55 + 0.7 * vn(t * 0.17));
  const wAng = 0.7 + 0.5 * Math.sin(t * 0.05);
  const wind = [Math.cos(wAng) * wMag, Math.sin(wAng) * wMag];
  const gust = vn(t * 0.35);
  const bend = [
    Math.sin(t * 1.3) * 0.08 + Math.sin(t * 2.9 + 1.7) * 0.04 + (vn(t * 0.8) - 0.5) * 0.22 + wind[0] * 0.6,
    Math.cos(t * 1.1) * 0.07 + Math.cos(t * 3.3) * 0.03 + (vn(t * 0.7 + 5) - 0.5) * 0.2 + wind[1] * 0.6
  ];

    bend[0] * 0.25 * S + (vn(t * 5.1 + 3) - 0.5) * 0.16,
    0.25 + 0.55 * S * heightF + (vn(t * 6.3 + 1) - 0.5) * 0.1,
    bend[1] * 0.25 * S + (vn(t * 4.7 + 8) - 0.5) * 0.16

  const k = P.tod;
  const night = sstep(0, 0.75, k);
  const zen = mix3([0.05, 0.095, 0.21], [25e-4, 5e-3, 0.015], Math.pow(sstep(0, 1, k), 0.8));
  const hor = mix3([0.62, 0.26, 0.13], [0.01, 0.016, 0.03], Math.pow(night, 0.7));
  const amb = mix3([0.024, 0.03, 0.05], [16e-4, 22e-4, 55e-4], Math.pow(night, 0.6));

var scene = {
  name: "fire",
  msaa: 4,
  params: {
    size: 1,
    intensity: 1,
    wind: 0.3,
    turb: 1,
    embers: 1,
    smoke: 1,
    grass: 1,
    grassWind: 1,
    tod: 0.5,
    mist: 0.85,
    haze: 1,
    exposure: 1.3,
    bloom: 0.14,
    vignette: 0.3,
    sat: 1.05,
    contrast: 1.1,
    warmth: 0,
    grain: 0.35
  },
  sliders: [
    ["size", "Fire size", 0.5, 1.6, 0.01],
    ["intensity", "Fire light", 0.2, 2.5, 0.01],
    ["turb", "Flame turbulence", 0.2, 2, 0.01],
    ["wind", "Wind", 0, 1.2, 0.01],
    ["embers", "Embers / sparks", 0, 3, 0.01],
    ["smoke", "Smoke", 0, 2.5, 0.01],
    ["grass", "Grass density", 0.05, 1, 0.01],
    ["grassWind", "Grass wind", 0, 3, 0.01],
    ["mist", "Mist", 0, 3, 0.01],
    ["haze", "Heat haze", 0, 3, 0.01],
    ["tod", "Dusk \u2192 night", 0, 1, 5e-3],
    ["exposure", "Exposure", 0.2, 6, 0.01],
    ["bloom", "Bloom", 0, 0.4, 2e-3]
  ],
  camera: { mode: "walk", x: 2.6, y: 1.2, z: 3.1, yaw: -40, pitch: 4, fov: 56, speed: 1.6, eye: 1.25, near: 0.03 },
  groundHeight,
  help: "click: mouse look \xB7 WASD walk \xB7 Shift run \xB7 wheel speed \xB7 H panel",
  constrainCamera(eng) {
    const c = eng.cam;
    const r = Math.hypot(c.x, c.z);
    const R = 1.5 * Math.max(1, this.S * 0.85);
    if (r < R) {
      const k = R / Math.max(r, 1e-3);
      c.x = r < 1e-3 ? R : c.x * k;
      c.z *= k;
    }
  },
  async init(eng) {
    const { device, queue, P } = eng;
    if (eng.qs.has("eye")) eng.cam.eye = Number(eng.qs.get("eye"));
    this.S = P.size;
    this.eng_queue = queue;
    const VF = STAGE.VERTEX | STAGE.FRAGMENT;
    const bglR = device.createBindGroupLayout({ entries: [
      { binding: 0, visibility: VF, buffer: { type: "uniform" } },
      { binding: 1, visibility: VF, buffer: { type: "uniform" } },
      { binding: 2, visibility: VF, texture: { sampleType: "float", viewDimension: "3d" } },
      { binding: 3, visibility: VF, sampler: { type: "filtering" } }
    ] });
    const bglP = device.createBindGroupLayout({ entries: [{ binding: 0, visibility: STAGE.VERTEX, buffer: { type: "read-only-storage" } }] });
    const bglC = device.createBindGroupLayout({ entries: [
      { binding: 0, visibility: STAGE.COMPUTE, buffer: { type: "uniform" } },
      { binding: 1, visibility: STAGE.COMPUTE, buffer: { type: "storage" } },
      { binding: 2, visibility: STAGE.COMPUTE, texture: { sampleType: "float", viewDimension: "3d" } },
      { binding: 3, visibility: STAGE.COMPUTE, sampler: { type: "filtering" } }
    ] });
    const bglN = device.createBindGroupLayout({ entries: [
      { binding: 0, visibility: STAGE.COMPUTE, storageTexture: { access: "write-only", format: "rgba8unorm", viewDimension: "3d" } }
    ] });

    const plRP = device.createPipelineLayout({ bindGroupLayouts: [bglR, bglP] });
    const plC = device.createPipelineLayout({ bindGroupLayouts: [bglC] });
    const plN = device.createPipelineLayout({ bindGroupLayouts: [bglN] });
    const noiseTex = device.createTexture({ size: [NOISE_RES, NOISE_RES, NOISE_RES], dimension: "3d", format: "rgba8unorm", usage: TU.TEXTURE_BINDING | TU.STORAGE_BINDING });
    const noiseMod = await eng.shader(NOISE_GEN, "noise gen");
    const noisePipe = await device.createComputePipelineAsync({ layout: plN, compute: { module: noiseMod, entryPoint: "main" } });
    {
      const enc = device.createCommandEncoder();
      const cp = enc.beginComputePass();
      cp.setPipeline(noisePipe);
      cp.setBindGroup(0, device.createBindGroup({ layout: bglN, entries: [{ binding: 0, resource: noiseTex.createView({ dimension: "3d" }) }] }));
      cp.dispatchWorkgroups(NOISE_RES / 4, NOISE_RES / 4, NOISE_RES / 4);
      cp.end();
      queue.submit([enc.finish()]);
    }
    const noiseView = noiseTex.createView({ dimension: "3d" });
    const nsamp = device.createSampler({ magFilter: "linear", minFilter: "linear", addressModeU: "repeat", addressModeV: "repeat", addressModeW: "repeat" });
    this.scnF = new Float32Array(34 * 4);
    this.scnBuf = eng.mkBuf(this.scnF.byteLength, GU.UNIFORM | GU.COPY_DST, "scene ubo");
    this.simF = new Float32Array(12);
    this.simBuf = eng.mkBuf(48, GU.UNIFORM | GU.COPY_DST, "sim ubo");
    const solids = buildSolids();
    this.scnF.set(solids.blockers, 40);
    this.bgR = device.createBindGroup({ layout: bglR, entries: [
      { binding: 0, resource: { buffer: eng.camUBO } },
      { binding: 1, resource: { buffer: this.scnBuf } },

      for (let i = 0; i < GN; i++) {
        const a = i + j * (GN + 1), b = a + 1, c = a + GN + 1, d = c + 1;

        gi[k++] = c;
        gi[k++] = b;
        gi[k++] = b;
        gi[k++] = c;
        gi[k++] = d;
      }

    this.groundCount = gi.length;

      const data = new Float32Array(n * 12);
      for (let i = 0; i < n; i++) {

        data[i * 12 + 11] = Math.random() * delaySpread;

        n,
        buf,
        bgC: device.createBindGroup({ layout: bglC, entries: [

      modOf(SKY, "sky"),
      modOf(GROUND, "ground"),
      modOf(GRASS, "grass"),
      modOf(SOLID, "solid"),
      modOf(FLAME, "flame"),
      modOf(SPARK, "spark"),
      modOf(SMOKE, "smoke"),

    f.set([st.amb[0], st.amb[1], st.amb[2], P.embers], 28);
    f.set([st.bend[0], st.bend[1], st.heightF, 0], 32);

  compute(eng, enc) {

  draw(eng, rp) {
    const P = eng.P;
    rp.setBindGroup(0, this.bgR);
    rp.setPipeline(this.pSolid);
    rp.setVertexBuffer(0, this.solidVB);
    rp.setIndexBuffer(this.solidIB, "uint32");
    rp.drawIndexed(this.solidCount);
    rp.setPipeline(this.pGround);
    rp.setIndexBuffer(this.groundIB, "uint32");
    rp.drawIndexed(this.groundCount);
    rp.setPipeline(this.pGrass);
    rp.setVertexBuffer(0, this.grassVB);

    rp.setPipeline(this.pSmoke);
    rp.setBindGroup(1, this.pools.smoke.bgP);
    rp.draw(6, N_SMOKE);
    rp.setPipeline(this.pFlame);
    rp.setBindGroup(0, this.bgR);
    rp.draw(6);
    rp.setPipeline(this.pSpark);
    rp.setBindGroup(1, this.pools.blobs.bgP);

    rp.draw(6, N_SPARK);
    rp.setPipeline(this.pFly);
    rp.draw(6, N_FLY);
