// js/engine/gpu.js

async function initGPU(canvas) {

    requiredFeatures: hasTS ? ["timestamp-query"] : [],
    requiredLimits: {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, 1 << 30),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, 1 << 30),
      maxStorageTexturesPerShaderStage: Math.min(adapter.limits.maxStorageTexturesPerShaderStage, 8)

  device.lost.then((i) => log("device lost: " + i.message));
  device.onuncapturederror = (e) => log("GPU error: " + e.error.message);

  const swapFormat = navigator.gpu.getPreferredCanvasFormat();

      if (msg.type === "error") bad = true;
      if (msg.type !== "info") {

        log(`[${label}] ${msg.type} ${msg.lineNum}:${msg.linePos} ${msg.message}

      let radial = smoothstep(rin * 0.9, rin * 1.08, rcm) * (1.0 - smoothstep(rout * 0.5, rout, rcm)) * pow(rin / rcm, 0.6);
      var nz = 0.5;
      if (core > 0.03) {
        let phi = atan2(dot(rvm, ez), dot(rvm, ex));
        let phis = phi + time * 2.2 * pow(rcm, -1.5);   // Keplerian shear: inner gas laps the outer
        nz = ringFbm(rcm, fract(phis / TAU));
        // large spiral arms: log-spiral twisted low-order mode
        let arm = rnoise(rcm * 1.6, fract(phis / TAU + 0.55 * log(rcm)), 6.0);
        nz = clamp(nz * (0.55 + 0.9 * arm), 0.0, 1.2);
        core *= 0.12 + 1.9 * pow(nz, 1.7);
      }
      let dens = (core + cor) * radial;
      let tau = 15.0 * dens * dt;
      if (tau > 1e-4) {
        // temperature profile of a thin disc
        let f = pow(rcm / rin, -0.75) * pow(max(1.0 - 0.75 * sqrt(rin / rcm), 0.0), 0.25) / 0.65;
        // emitter velocity (circular orbit) and combined Doppler + gravitational redshift
        let tang = cross(n, rvm) / rcm;
        let vmag = min(sqrt(0.5 / max(rcm - 1.0, 0.05)), 0.8);
        let gam = 1.0 / sqrt(1.0 - vmag * vmag);
        let gd = 1.0 / (gam * (1.0 + vmag * dot(tang, v)));
        let g = gd * sqrt(max(1.0 - 1.0 / rcm, 0.03));
        let Tcol = temp * f * pow(g, 0.9);
        let S = bright * f * f * pow(g, 3.6) * (0.25 + 1.6 * nz);
        let c = bbColor(Tcol) * S;
        let a = 1.0 - exp(-tau);
        col += Tr * a * c;
        Tr *= 1.0 - a;
        if (Tr < 0.004) { status = 1; break; }
      }
    }

    v = normalize(v + acc * dt);
    p += v * dt;
  }

  var o: FO;
  if (status == 2) {
    o.c = vec4f(col, Tr);
    o.d = vec4f(v, 1.0);
  } else {
    o.c = vec4f(col, 0.0);
    o.d = vec4f(0.0);
  }
  return o;
}
`;
var COMP = COMMON + /* wgsl */
`
@group(0) @binding(2) var texA: texture_2d<f32>;
@group(0) @binding(3) var texD: texture_2d<f32>;
@group(0) @binding(4) var samp: sampler;

fn ld(c: vec2i) -> vec4f {
  let d = vec2i(textureDimensions(texD));
  return textureLoad(texD, clamp(c, vec2i(0), d - vec2i(1)), 0);
}

const GN: vec3f = vec3f(0.2955, 0.9553, 0.0);          // galactic pole (normalised by hand)
const CD: vec3f = vec3f(-0.30, 0.10, -0.95);           // galactic-centre direction

struct Gal { col: vec3f, dens: f32, dust: f32 }

fn galaxy(dir: vec3f) -> Gal {
  let e1 = normalize(CD - GN * dot(CD, GN));
  let e2 = cross(GN, e1);
  let lon = atan2(dot(dir, e2), dot(dir, e1));
  let b = dot(dir, GN);
  let w = fbm3(dir * 3.0 + vec3f(1.7, 0.3, 2.9), 3) - 0.5;
  let bb = b + w * 0.16;
  let disc = exp(-pow(bb / 0.10, 2.0));
  let halo = exp(-pow(bb / 0.42, 2.0)) * 0.22;
  let bulge = exp(-lon * lon / 0.30 - pow(bb / 0.20, 2.0));
  let lonFall = 0.35 + 0.65 * exp(-lon * lon / 2.2);
  let st = fbm3(dir * 9.0 + vec3f(5.2, 1.1, 3.3), 5);
  let fine = fbm3(dir * 38.0 + vec3f(3.0, 8.0, 1.0), 3);
  let clouds = (0.12 + 2.0 * st * st) * (0.5 + 1.0 * fine);
  let dustN = fbm3(dir * 13.0 + vec3f(9.1, 2.2, 4.4), 5);
  let dust = smoothstep(0.46, 0.66, dustN) * exp(-pow(bb / 0.13, 2.0));
  let att = 1.0 - 0.9 * dust;
  let stellar = (disc * lonFall * clouds + halo * lonFall + 1.5 * bulge) * att;
  let warm = clamp(bulge * 1.2 + 0.4 * exp(-lon * lon / 1.2), 0.0, 1.0);
  var col = stellar * mix(vec3f(0.50, 0.66, 1.0), vec3f(1.0, 0.76, 0.48), warm);
  // emission nebulae near the plane
  let nb = fbm3(dir * 5.0 + vec3f(31.0, 7.0, 11.0), 4);
  let nmask = smoothstep(0.52, 0.78, nb) * exp(-pow(b / 0.38, 2.0));
  let nc = mix(vec3f(0.95, 0.22, 0.45), vec3f(0.12, 0.45, 0.95), smoothstep(0.35, 0.65, fbm3(dir * 3.0 + vec3f(2.0, 8.0, 4.0), 3)));
  col += nc * nmask * 0.22 * (0.4 + dust * 0.0 + 0.8 * st);
  var g: Gal;
  g.col = col * 0.05;
  g.dens = stellar;
  g.dust = att;
  return g;
}

fn facePoint(face: i32, uv: vec2f) -> vec3f {
  switch (face) {
    case 0: { return vec3f(1.0, uv.y, uv.x); }
    case 1: { return vec3f(-1.0, uv.y, uv.x); }
    case 2: { return vec3f(uv.x, 1.0, uv.y); }
    case 3: { return vec3f(uv.x, -1.0, uv.y); }
    case 4: { return vec3f(uv.x, uv.y, 1.0); }
    default: { return vec3f(uv.x, uv.y, -1.0); }
  }
}

// one layer of procedural stars on a cube-map grid; fp = sky footprint of this pixel (rad)
fn starLayer(dir: vec3f, N: f32, seed: f32, prob: f32, fluxBase: f32, fp: f32, sig0: f32, boost: f32) -> vec3f {
  let a = abs(dir);
  let m = max(a.x, max(a.y, a.z));
  var face = 5; var uv = vec2f(0.0);
  if (a.x == m) { face = select(1, 0, dir.x > 0.0); uv = vec2f(dir.z, dir.y) / m; }
  else if (a.y == m) { face = select(3, 2, dir.y > 0.0); uv = vec2f(dir.x, dir.z) / m; }
  else { face = select(5, 4, dir.z > 0.0); uv = vec2f(dir.x, dir.y) / m; }
  let cell = floor((uv * 0.5 + 0.5) * N);
  let key = vec3f(cell, f32(face) + seed * 7.0);
  let h = hash33(key);
  let ex = hash13(key + vec3f(3.1, 7.7, 1.3));
  let cellAng = 1.7 / N;
  let sigma2 = sig0 * sig0 + 0.25 * fp * fp;
  let p = prob * u.e.x * boost;
  // unresolved average radiance of this layer (used when the footprint spans many cells)
  let meanRad = p * fluxBase * 3.0 * sig0 * sig0 * N * N;
  let wide = smoothstep(0.12, 0.45, fp / cellAng);
  var res = vec3f(0.0);
  if (ex < p && wide < 0.999) {
    let suv = ((cell + 0.25 + 0.5 * h.xy) / N) * 2.0 - 1.0;
    let sdir = normalize(facePoint(face, suv));
    let d = dir - sdir;
    let d2 = dot(d, d);
    let F = fluxBase * (0.25 + 3.0 * pow(h.z, 3.0));
    let tk = pow(hash13(key + vec3f(11.0, 5.0, 2.0)), 1.6);
    let c = bbColor(mix(3200.0, 14000.0, tk));
    res = c * F * (sig0 * sig0 / sigma2) * exp(-0.5 * d2 / sigma2) * (1.0 - wide);
  }
  return res + vec3f(1.0, 0.94, 0.88) * meanRad * wide;
}

fn background(dir: vec3f, fp: f32) -> vec3f {
  let sig0 = 0.45 * max(u.f.w, u.g.x);
  let g = galaxy(dir);
  let boost = 1.0 + 5.0 * clamp(g.dens, 0.0, 1.5);
  var col = g.col;
  var st = vec3f(0.0);
  st += starLayer(dir, 22.0, 0.0, 0.40, 5.0, fp, sig0, 1.0);
  st += starLayer(dir, 58.0, 1.0, 0.30, 1.5, fp, sig0, boost * 0.5);
  st += starLayer(dir, 150.0, 2.0, 0.22, 0.55, fp, sig0, boost * 0.6);
  st += starLayer(dir, 380.0, 3.0, 0.12, 0.22, fp, sig0, boost * 0.7);
  st += starLayer(dir, 900.0, 4.0, 0.06, 0.12, fp, sig0, boost * 0.8);
  col += st * mix(1.0, g.dust, 0.8);
  // distant blue giant: lensed into an arc/ring when it lines up behind the hole
  let cd = normalize(vec3f(0.42, 0.16, -0.89));
  let dd = dir - cd;
  let d2 = dot(dd, dd);
  let s2 = sig0 * sig0 * 1.8 + 0.25 * fp * fp;
  col += vec3f(0.62, 0.78, 1.0) * 24.0 * (sig0 * sig0 * 1.8 / s2) * exp(-0.5 * d2 / s2);
  let hk = min(1.0, 4.0e-6 / (fp * fp + 1e-9));
  col += vec3f(0.55, 0.72, 1.0) * 0.0009 * hk / (d2 + 0.00006);
  return col;
}

@fragment fn fs(in: VO) -> @location(0) vec4f {
  let outRes = u.e.zw;
  let uv = in.pos.xy / outRes;
  let resA = u.c.xy;
  let ap = uv * resA - 0.5;
  let i0 = vec2i(floor(ap));
  let f = fract(ap);
  let d00 = ld(i0);
  let d10 = ld(i0 + vec2i(1, 0));
  let d01 = ld(i0 + vec2i(0, 1));
  let d11 = ld(i0 + vec2i(1, 1));
  let w00 = (1.0 - f.x) * (1.0 - f.y) * d00.w;
  let w10 = f.x * (1.0 - f.y) * d10.w;
  let w01 = (1.0 - f.x) * f.y * d01.w;
  let w11 = f.x * f.y * d11.w;
  let ws = w00 + w10 + w01 + w11;
  let ca = textureSampleLevel(texA, samp, uv, 0.0);
  var bg = vec3f(0.0);
  if (ws > 1e-4 && ca.a > 0.002) {
    let dir = normalize((d00.xyz * w00 + d10.xyz * w10 + d01.xyz * w01 + d11.xyz * w11) / ws);
    var fp = 0.0;
    if (d00.w > 0.5 && d10.w > 0.5) { fp = max(fp, length(d10.xyz - d00.xyz)); }
    if (d00.w > 0.5 && d01.w > 0.5) { fp = max(fp, length(d01.xyz - d00.xyz)); }
    if (d11.w > 0.5 && d10.w > 0.5) { fp = max(fp, length(d11.xyz - d10.xyz)); }
    if (d11.w > 0.5 && d01.w > 0.5) { fp = max(fp, length(d11.xyz - d01.xyz)); }
    fp = max(fp * u.e.y, 0.5 * u.g.x);
    bg = background(dir, fp);
  }
  return vec4f(ca.rgb + ca.a * bg, 1.0);
}
`;

// js/scenes/space/main.js
function isco(a) {
  const z1 = 1 + Math.cbrt(1 - a * a) * (Math.cbrt(1 + a) + Math.cbrt(1 - a));
  const z2 = Math.sqrt(3 * a * a + z1 * z1);
  return (3 + z2 - Math.sqrt((3 - z1) * (3 + z1 + 2 * z2))) * 0.5;
}
var scene = {
  name: "space",
  msaa: 1,
  params: {
    exposure: 1,
    bloom: 0.14,
    vignette: 0.22,
    sat: 1.08,
    contrast: 1.06,
    warmth: 0.04,
    grain: 0.35,
    spin: 0.7,
    mass: 1,
    bright: 1,
    temp: 6500,
    tilt: 0,
    thick: 1,
    steps: 320,
    starDensity: 1,
    scale: 1,
    auto: 1
  },
  sliders: [
    ["spin", "Black hole spin", 0, 0.99, 0.01],
    ["mass", "Mass (rs scale)", 0.4, 2.5, 0.01],
    ["bright", "Disc brightness", 0.1, 4, 0.01],
    ["temp", "Disc temperature (K)", 2500, 12e3, 50],
    ["tilt", "Disc tilt (deg)", -60, 60, 0.5],
    ["thick", "Disc thickness", 0.3, 4, 0.01],
    ["steps", "Lensing steps", 80, 640, 10],
    ["starDensity", "Star density", 0, 2.5, 0.01],
    ["exposure", "Exposure", 0.1, 4, 0.01],
    ["bloom", "Bloom", 0, 0.4, 5e-3],
    ["scale", "Render scale", 0.4, 1.5, 0.05],
    ["auto", "Auto scale (0/1)", 0, 1, 1]
  ],
  camera: { mode: "orbit", target: [0, 0, 0], dist: 26, minDist: 1.6, maxDist: 250, yaw: 24, pitch: -7, fov: 52, autoRotate: 1.2, minPitch: -1.45, maxPitch: 1.45 },
  help: "drag: orbit \xB7 wheel: zoom (lensing grows as you fall in) \xB7 WASD/QE slide target \xB7 H panel",
  async init(eng) {
    const { device } = eng;
    this.ubo = eng.mkBuf(128, GU.UNIFORM | GU.COPY_DST, "bh ubo");
    this.u = new Float32Array(32);
    const trMod = await eng.shader(TRACE, "bh trace");
    this.tracePipe = await device.createRenderPipelineAsync({
      label: "bh trace",
      layout: "auto",
      vertex: { module: trMod, entryPoint: "vs" },
      fragment: { module: trMod, entryPoint: "fs", targets: [{ format: "rgba16float" }, { format: "rgba32float" }] }
    });
    const cpMod = await eng.shader(COMP, "bh composite");
    this.compPipe = await eng.renderPipe({
      label: "bh composite",
      vertex: { module: cpMod, entryPoint: "vs" },
      fragment: { module: cpMod, entryPoint: "fs" },
      depthStencil: { format: eng.DEPTH, depthWriteEnabled: false, depthCompare: "always" }
    });
    if (eng.W * eng.H > 3e6 && !eng.qs.has("scale") && !eng.qs.has("shot")) eng.P.scale = 0.6;
    this.avg = 0;
    this.acc = 0;
    this.traceBG = eng.bg(this.tracePipe, [{ buffer: eng.camUBO }, { buffer: this.ubo }], "trace bg");
    this.alloc(eng);
  },
  // pass-A targets follow the output size x render scale
  alloc(eng) {
    const { device } = eng;
    const w = Math.max(16, Math.round(eng.W * eng.P.scale)), h = Math.max(16, Math.round(eng.H * eng.P.scale));
    if (this.texA && this.aw === w && this.ah === h) return;
    this.texA && this.texA.destroy();
    this.texD && this.texD.destroy();
    this.aw = w;
    this.ah = h;
    const usage = TU.RENDER_ATTACHMENT | TU.TEXTURE_BINDING;
    this.texA = device.createTexture({ size: [w, h], format: "rgba16float", usage });
    this.texD = device.createTexture({ size: [w, h], format: "rgba32float", usage });
    this.passA = {
      colorAttachments: [
        { view: this.texA.createView(), clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: "clear", storeOp: "store" },
        { view: this.texD.createView(), clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: "clear", storeOp: "store" }
      ]
    };
    this.compBG = device.createBindGroup({
      label: "comp bg",
      layout: this.compPipe.getBindGroupLayout(0),
      entries: [
        { binding: 1, resource: { buffer: this.ubo } },
        { binding: 2, resource: this.texA.createView() },
        { binding: 3, resource: this.texD.createView() },
        { binding: 4, resource: eng.sampClamp }
      ]
    });
  },
  // ?bench=1 : GPU time of the trace pass and the composite pass (ms/frame), logged once
  async bench(eng) {
    const { device } = eng;
    const col = device.createTexture({ size: [eng.W, eng.H], format: "rgba16float", usage: TU.RENDER_ATTACHMENT });
    const dep = device.createTexture({ size: [eng.W, eng.H], format: eng.DEPTH, usage: TU.RENDER_ATTACHMENT });
    const pb = {
      colorAttachments: [{ view: col.createView(), loadOp: "clear", storeOp: "store" }],
      depthStencilAttachment: { view: dep.createView(), depthClearValue: 0, depthLoadOp: "clear", depthStoreOp: "discard" }
    };
    const time = async (fn, n = 20) => {
      await device.queue.onSubmittedWorkDone();
      const t0 = performance.now();
      for (let i = 0; i < n; i++) {
        const e = device.createCommandEncoder();
        fn(e);
        device.queue.submit([e.finish()]);
      }
      await device.queue.onSubmittedWorkDone();
      return (performance.now() - t0) / n;
    };
    const a = await time((e) => this.compute(eng, e));
    const b = await time((e) => {
      const r = e.beginRenderPass(pb);
      this.draw(eng, r);
      r.end();
    });
    log(`bench ${eng.W}x${eng.H} scale ${eng.P.scale}: trace ${a.toFixed(2)} ms, composite ${b.toFixed(2)} ms`);
  },
  onResize(eng) {
    this.alloc(eng);
  },
  onParam(key, eng) {
    if (key === "scale") this.alloc(eng);
  },
  update(eng) {
    const P = eng.P, C = eng.cam, u = this.u;
    C.dist = Math.max(C.dist, 1.5 * P.mass);
    const t = P.tilt * D2R;
    const rs = P.mass;
    u[0] = 1;
    u[1] = P.spin;
    u[2] = P.bright;
    u[3] = P.temp;
    u[4] = 0;
    u[5] = P.thick;
    u[6] = P.steps;
    u[7] = eng.time;
    u[8] = this.aw;
    u[9] = this.ah;
    u[10] = isco(P.spin) / 1;
    u[11] = 11;
    u[12] = 0;
    u[13] = Math.cos(t);
    u[14] = Math.sin(t);
    u[15] = 0.05 * Math.min(2.5, Math.max(0.6, 320 / P.steps));
    u[16] = P.starDensity;
    u[17] = this.aw / eng.W;
    u[18] = eng.W;
    u[19] = eng.H;
    u[20] = C.x / rs;
    u[21] = C.y / rs;
    u[22] = C.z / rs;
    u[23] = 2 * eng.basis.tanY / 1080;
    u[24] = 2 * eng.basis.tanY / eng.H;
    eng.queue.writeBuffer(this.ubo, 0, u);
    if (P.auto && !eng.qs.has("shot") && eng.dt > 0) {
      this.avg = this.avg ? this.avg * 0.95 + eng.dt * 0.05 : eng.dt;
      this.acc += eng.dt;
      if (this.acc > 1) {
        this.acc = 0;
        if (this.avg > 0.0205 && P.scale > 0.5) {
          P.scale = Math.max(0.5, +(P.scale - 0.1).toFixed(2));
          this.alloc(eng);
          this.avg = 0;
        }
      }
    }
    if (eng.qs.has("bench") && eng.frame === 5) this.bench(eng);
  },
  compute(eng, enc) {
    const rp = enc.beginRenderPass(this.passA);
    rp.setPipeline(this.tracePipe);
    rp.setBindGroup(0, this.traceBG);
    rp.draw(3);
    rp.end();
  },
  draw(eng, rp) {
    rp.setPipeline(this.compPipe);
    rp.setBindGroup(0, this.compBG);
    rp.draw(3);
  }
};
boot(scene);
