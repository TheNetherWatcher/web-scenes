<style>

       text-shadow: 0 1px 2px #000a; pointer-events: none; user-select: none; }

         backdrop-filter: blur(6px); border: 1px solid #ffffff18; }

         background: #0b0f14c8; backdrop-filter: blur(6px); color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif;
         max-height: calc(100% - 40px); overflow: auto; }

// js/engine/gpu.js

    });

  }
}
function fail(msg) {
  const el = document.getElementById("err");

async function initGPU(canvas) {

  if (!adapter) fail("No WebGPU adapter found.");
  const hasTS = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({
    requiredFeatures: hasTS ? ["timestamp-query"] : [],
    requiredLimits: {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, 1 << 30),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, 1 << 30),
      maxStorageTexturesPerShaderStage: Math.min(adapter.limits.maxStorageTexturesPerShaderStage, 8)

  });
  device.lost.then((i) => log("device lost: " + i.message));
  device.onuncapturederror = (e) => log("GPU error: " + e.error.message);

  const swapFormat = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: swapFormat, alphaMode: "opaque", usage: TU.RENDER_ATTACHMENT | TU.COPY_SRC });

    const info = await m.getCompilationInfo();
    let bad = false;
    for (const msg of info.messages) {
      if (msg.type === "error") bad = true;
      if (msg.type !== "info") {
        const line = code.split("\n")[msg.lineNum - 1];
        log(`[${label}] ${msg.type} ${msg.lineNum}:${msg.linePos} ${msg.message}

    device.queue.writeBuffer(b, 0, data);

        sd.set([b4[0] - b4[2] * b.len * 0.2, 5.6 + bob, b4[1] - b4[3] * b.len * 0.2, 2.2, 3.4, 2.7, 1.8, 0], si * 8);
        si++;
      }
    });
    const [hx, hz] = gridToWorld(-100 + Math.cos(t * 0.03) * 1700, 7300 + Math.sin(t * 0.03) * 1700);
    sd.set([hx, 420, hz, 2.4, 3, 3, 3, -1.1], si * 8);
    si++;
    sd.set([hx + 6, 421, hz, 2, 3.2, 0.2, 0.1, 0.9], si * 8);
    si++;
    const jt = t * 70 % 14e3;
    const [jx, jz] = gridToWorld(-5200 + jt, 9500 - jt * 0.55);
    sd.set([jx, 900 - jt * 0.02, jz, 3.5, 6, 6, 6, 0], si * 8);
    si++;
    sd.set([jx, 902 - jt * 0.02, jz, 3.5, 6, 0.2, 0.2, -0.8], si * 8);
    si++;
    this.nBoatInst = bi;
    this.nDynSpr = si;
    eng.queue.writeBuffer(this.boatInstBuf, 0, bd, 0, bi * 12);
    eng.queue.writeBuffer(this.dynSprBuf, 0, sd, 0, si * 8);
    const fr = this.scnF2;
    fr.set(f);
    eng.queue.writeBuffer(this.scnBuf[0], 0, f);
    fr[32 + 3] = 1;
    eng.queue.writeBuffer(this.scnBuf[1], 0, fr);
  },
  drawWorld(rp, pipes, bgs) {
    const c = this.city;
    rp.setPipeline(pipes[0]);
    rp.setBindGroup(0, bgs[0]);
    rp.setVertexBuffer(0, this.instBuf);
    rp.draw(30, c.instCount);
    if (this.nBoatInst) {
      rp.setVertexBuffer(0, this.boatInstBuf);
      rp.draw(30, this.nBoatInst);
    }
    rp.setPipeline(pipes[1]);
    rp.setBindGroup(0, bgs[1]);
    rp.setVertexBuffer(0, this.beamBuf);
    rp.draw(6, c.beamCount);
  },
  drawLights(rp, pipes, bgs) {
    const c = this.city;
    rp.setPipeline(pipes[2]);
    rp.setBindGroup(0, bgs[2]);
    rp.setVertexBuffer(0, this.sprBuf);
    rp.draw(6, c.spriteCount);
    rp.setVertexBuffer(0, this.dynSprBuf);
    rp.draw(6, this.nDynSpr);
  },
  compute(eng, enc) {
    const rp = enc.beginRenderPass({
      colorAttachments: [{ view: this.reflView, clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: "clear", storeOp: "store" }],
      depthStencilAttachment: { view: this.reflDepthView, depthClearValue: 0, depthLoadOp: "clear", depthStoreOp: "discard" }
    });
    this.drawWorld(rp, this.pipes.refl, this.bgRefl);
    this.drawLights(rp, this.pipes.refl, this.bgRefl);
    rp.end();
  },
  draw(eng, rp) {
    const bgs = this.bgMain;
    this.drawWorld(rp, this.pipes.main, bgs);
    rp.setPipeline(this.gndPipe);
    rp.setBindGroup(0, this.gndBG);
    rp.draw(6);
    rp.setPipeline(this.skyPipe);
    rp.setBindGroup(0, this.skyBG);
    rp.draw(3);
    this.drawLights(rp, this.pipes.main, bgs);
  }
};
boot(scene);

</script>
