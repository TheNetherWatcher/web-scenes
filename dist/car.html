<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supercar — WebGPU</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.45 ui-monospace, Consolas, monospace; color: #e8e2d6;
       text-shadow: 0 1px 2px #000a; pointer-events: none; user-select: none; }
#hud .help { opacity: .7; }
#nav { position: fixed; left: 12px; top: 10px; display: flex; gap: 4px; font: 12px system-ui, sans-serif; }
#nav a { color: #e5e1d8; text-decoration: none; padding: 5px 11px; border-radius: 999px; background: #0b0f1488;
         backdrop-filter: blur(6px); border: 1px solid #ffffff18; }
#nav a:hover { background: #0b0f14cc; }
#nav a.on { background: #e2a04e; color: #1a1208; border-color: #e2a04e; font-weight: 600; }
#panel { position: fixed; right: 12px; top: 10px; width: 300px; padding: 10px 12px; border-radius: 8px;
         background: #0b0f14c8; backdrop-filter: blur(6px); color: #e5e1d8; font: 12px/1.3 system-ui, sans-serif;
         max-height: calc(100% - 40px); overflow: auto; }
#panel.hidden { display: none; }
#panel label { display: grid; grid-template-columns: 1fr 110px 40px; gap: 6px; align-items: center; margin: 3px 0; }
#panel input { width: 110px; accent-color: #e2a04e; }
#panel output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
#err { position: fixed; inset: 0; display: none; padding: 40px; color: #f88; font: 16px system-ui; white-space: pre-wrap; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav id="nav"></nav>

<script type="module">
// js/engine/gpu.js
var GU = GPUBufferUsage;
var TU = GPUTextureUsage;
var HDR = "rgba16float";
var DEPTH = "depth32float";
function log(msg) {
  console.log(msg);
  try {
    fetch("/__log", { method: "POST", body: String(msg) }).catch(() => {
    });
  } catch (e) {
  }
}
function fail(msg) {
  const el = document.getElementById("err");
  if (el) {
    el.style.display = "block";
    el.textContent = msg;
  }
  log("FATAL " + msg);
  throw new Error(msg);
}
async function initGPU(canvas) {
  if (!navigator.gpu) fail("WebGPU is not available in this browser. Use a recent Chrome.");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) fail("No WebGPU adapter found.");
  const hasTS = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({
    requiredFeatures: hasTS ? ["timestamp-query"] : [],
    requiredLimits: {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, 1 << 30),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, 1 << 30),
      maxStorageTexturesPerShaderStage: Math.min(adapter.limits.maxStorageTexturesPerShaderStage, 8)
    }
  });
  device.lost.then((i) => log("device lost: " + i.message));
  device.onuncapturederror = (e) => log("GPU error: " + e.error.message);
  const ctx = canvas.getContext("webgpu");
  const swapFormat = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: swapFormat, alphaMode: "opaque", usage: TU.RENDER_ATTACHMENT | TU.COPY_SRC });
  return { adapter, device, ctx, swapFormat, hasTS };
}
function makeHelpers(device) {
  async function shader(code, label) {
    const m = device.createShaderModule({ code, label });
    const info = await m.getCompilationInfo();
    let bad = false;
    for (const msg of info.messages) {
      if (msg.type === "error") bad = true;
      if (msg.type !== "info") {
        const line = code.split("\n")[msg.lineNum - 1];
        log(`[${label}] ${msg.type} ${msg.lineNum}:${msg.linePos} ${msg.message}
    ${line}`);
      }
    }
    if (bad) fail("Shader compile error in " + label + " (see console)");
    return m;
  }
  async function computePipe(code, label, entryPoint = "main") {
    const module = await shader(code, label);
    return device.createComputePipelineAsync({ label, layout: "auto", compute: { module, entryPoint } });
  }
  const mkBuf = (size, usage, label) => device.createBuffer({ size, usage, label });
  const bg = (pipe, entries, label, group = 0) => device.createBindGroup({
    label,
    layout: pipe.getBindGroupLayout(group),
    entries: entries.map((r, i) => ({ binding: i, resource: r }))
  });
  const bufFrom = (data, usage, label) => {
    const b = device.createBuffer({ size: Math.ceil(data.byteLength / 4) * 4, usage: usage | GU.COPY_DST, label });
    device.queue.writeBuffer(b, 0, data);
    return b;
  };
  return { shader, computePipe, mkBuf, bg, bufFrom };
}

// js/engine/wgsl.js
var CAM_WGSL = (
  /* wgsl */
  `
struct Cam {
  viewProj: mat4x4f,
  pos: vec4f,        // xyz world position, w = time (s)
  right: vec4f,      // xyz = right * tan(fovX/2)
  up: vec4f,         // xyz = up * tan(fovY/2)
  fwd: vec4f,        // xyz forward
  res: vec4f,        // width, height, 1/width, 1/height (pixels)
  misc: vec4f,       // near, frameIndex, dt, 0
}
// world-space view ray for a fragment position (in.pos.xy)
fn camRay(c: Cam, frag: vec2f) -> vec3f {
  let ndc = vec2f(frag.x * c.res.z * 2.0 - 1.0, 1.0 - frag.y * c.res.w * 2.0);
  return normalize(c.fwd.xyz + ndc.x * c.right.xyz + ndc.y * c.up.xyz);
}
`
);
var FULLSCREEN_VS = (
  /* wgsl */
  `
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO;
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);   // z = 0 -> far plane in reverse-Z

);
var NOISE_WGSL = (
  /* wgsl */
  `

const TAU: f32 = 6.28318530718;
fn sat(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
fn sat3(x: vec3f) -> vec3f { return clamp(x, vec3f(0.0), vec3f(1.0)); }
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }
fn hash11(p: f32) -> f32 { var x = fract(p * 0.1031); x *= x + 33.33; x *= x + x; return fract(x); }
fn hash12(p: vec2f) -> f32 {
  var p3 = fract(vec3f(p.xyx) * 0.1031);

  return fract((p3.x + p3.y) * p3.z);

  var p3 = fract(p * 0.1031);

  return fract((p3.x + p3.y) * p3.z);
}

  var p3 = fract(vec3f(p.xyx) * vec3f(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
fn hash33(p: vec3f) -> vec3f {
  var p3 = fract(p * vec3f(0.1031, 0.1030, 0.0973));

  return fract((p3.xxy + p3.yxx) * p3.zyx);

                 mix(hash13(i + vec3f(0, 1, 0)), hash13(i + vec3f(1, 1, 0)), u.x), u.y),
             mix(mix(hash13(i + vec3f(0, 0, 1)), hash13(i + vec3f(1, 0, 1)), u.x),

fn fbm2(p0: vec2f, oct: i32) -> f32 {

  for (var i = 0; i < oct; i++) { s += a * vnoise2(p); p = p * 2.03 + vec2f(17.1, 9.2); a *= 0.5; }

fn fbm3(p0: vec3f, oct: i32) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;

  return s;

`
);

// js/engine/post.js
var BLOOM_DOWN = FULLSCREEN_VS + /* wgsl */
`
struct P { texel: vec4f };   // xy = 1/src size, z = first pass (karis + threshold)
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: P;
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }

fn karis(c: vec3f) -> f32 { return 1.0 / (1.0 + luma(c) * 0.25); }
@fragment fn fs(in: VO) -> @location(0) vec4f {
  let t = U.texel.xy;
  let uv = in.uv;
  let a = tap(uv + t * vec2f(-2.0, -2.0));
  let b = tap(uv + t * vec2f(0.0, -2.0));
  let c = tap(uv + t * vec2f(2.0, -2.0));
  let d = tap(uv + t * vec2f(-2.0, 0.0));
  let e = tap(uv);
  let f = tap(uv + t * vec2f(2.0, 0.0));
  let g = tap(uv + t * vec2f(-2.0, 2.0));
  let h = tap(uv + t * vec2f(0.0, 2.0));
  let i = tap(uv + t * vec2f(2.0, 2.0));
  let j = tap(uv + t * vec2f(-1.0, -1.0));
  let k = tap(uv + t * vec2f(1.0, -1.0));
  let l = tap(uv + t * vec2f(-1.0, 1.0));
  let m = tap(uv + t * vec2f(1.0, 1.0));

  if (U.texel.z > 0.5) {
    let g0 = (a + b + d + e) * 0.25;
    let g1 = (b + c + e + f) * 0.25;
    let g2 = (d + e + g + h) * 0.25;
    let g3 = (e + f + h + i) * 0.25;
    let g4 = (j + k + l + m) * 0.25;
    let w0 = karis(g0) * 0.125; let w1 = karis(g1) * 0.125; let w2 = karis(g2) * 0.125;
    let w3 = karis(g3) * 0.125; let w4 = karis(g4) * 0.5;
    o = (g0 * w0 + g1 * w1 + g2 * w2 + g3 * w3 + g4 * w4) / (w0 + w1 + w2 + w3 + w4);

    o = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;

`;
var BLOOM_UP = FULLSCREEN_VS + /* wgsl */
`
struct P { texel: vec4f };   // xy = 1/src size, z = radius, w = weight
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: P;
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(src, samp, uv, 0.0).rgb; }
@fragment fn fs(in: VO) -> @location(0) vec4f {
  let t = U.texel.xy * U.texel.z;
  let uv = in.uv;
  var o = tap(uv) * 4.0;
  o += (tap(uv + vec2f(-t.x, 0.0)) + tap(uv + vec2f(t.x, 0.0)) + tap(uv + vec2f(0.0, -t.y)) + tap(uv + vec2f(0.0, t.y))) * 2.0;
  o += tap(uv + vec2f(-t.x, -t.y)) + tap(uv + vec2f(t.x, -t.y)) + tap(uv + vec2f(-t.x, t.y)) + tap(uv + vec2f(t.x, t.y));
  return vec4f(o * (U.texel.w / 16.0), 1.0);
}
`;
var COMPOSITE = FULLSCREEN_VS + /* wgsl */
`
struct P { p: vec4f, q: vec4f };  // p: exposure, bloom, frame, vignette; q: saturation, contrast, warmth, grain
@group(0) @binding(0) var hdr: texture_2d<f32>;
@group(0) @binding(1) var bloom: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@group(0) @binding(3) var<uniform> U: P;

fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x;
  let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
fn agx(v: vec3f) -> vec3f {

                  0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let minEv = -12.47393;
  let maxEv = 4.026069;
  var x = m * max(v, vec3f(1e-10));
  x = clamp(log2(x), vec3f(minEv), vec3f(maxEv));
  x = (x - minEv) / (maxEv - minEv);

fn agxEotf(v: vec3f) -> vec3f {
  let mi = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                   -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                   -0.0990297440797205, -0.0989611768448433, 1.15107367264116);

  let dims = vec2f(textureDimensions(hdr));

  let b = textureSampleLevel(bloom, samp, in.uv, 0.0).rgb * (1.0 / 8.0);
  c = mix(c, b, U.p.y);
  c *= U.p.x;
  let d = (in.uv - 0.5) * vec2f(dims.x / dims.y, 1.0);

`;

// js/engine/math.js
var D2R = Math.PI / 180;
function mat4Mul(out, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    out[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return out;
}
var clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// js/engine/engine.js
var BLOOM_LEVELS = 8;
var NAV = [["car", "Supercar"], ["city", "New York"], ["space", "Black hole"], ["fire", "Campfire"]];
async function run(scene2) {
  const qs2 = new URLSearchParams(location.search);
  const canvas = document.getElementById("c");

  const helpers = makeHelpers(device);
  const queue = device.queue;
  const P = { exposure: 1, bloom: 0.1, vignette: 0.1, sat: 1.05, contrast: 1.06, warmth: 0, grain: 0, ...scene2.params };
  for (const k of Object.keys(P)) if (qs2.has(k)) P[k] = Number(qs2.get(k));
  const msaa = scene2.msaa || 4;

    device,
    queue,
    canvas,
    ctx,
    swapFormat,
    P,
    msaa,
    qs: qs2,
    camUBO,
    ...helpers,
    HDR,
    DEPTH,
    W: 0,
    H: 0,
    time: Number(qs2.get("t")) || 0,
    frame: 0,
    dt: 0,
    keys: /* @__PURE__ */ Object.create(null),
    cam: null,
    sampLinear: device.createSampler({ magFilter: "linear", minFilter: "linear", mipmapFilter: "linear", addressModeU: "repeat", addressModeV: "repeat", maxAnisotropy: 8 }),
    sampClamp: device.createSampler({ magFilter: "linear", minFilter: "linear", mipmapFilter: "linear", addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge", addressModeW: "clamp-to-edge" }),
    sampNearest: device.createSampler({ magFilter: "nearest", minFilter: "nearest", addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge" }),
    // render pipeline defaults matching the main pass (HDR colour, reverse-Z depth, MSAA)

    // draw a render pipeline description pre-filled with the main-pass state
    renderPipe(desc) {

        layout: "auto",
        primitive: { topology: "triangle-list", cullMode: "none" },
        depthStencil: { format: DEPTH, depthWriteEnabled: true, depthCompare: "greater" },
        multisample: { count: msaa },

    mode: "fly",
    x: 0,
    y: 2,
    z: 0,
    yaw: 0,
    pitch: 0,
    fov: 60,
    speed: 5,
    near: 0.05,
    minY: -1e9,
    target: [0, 0, 0],
    dist: 5,
    minDist: 1,
    maxDist: 100,
    minPitch: -1.45,

    eye: 1.7,
    autoRotate: 0,
    ...scene2.camera

      C.target = [v[0], v[1], v[2]];
      C.yaw = (v[3] || 0) * D2R;
      C.pitch = (v[4] || 0) * D2R;
      if (v[5]) C.dist = v[5];
    } else {
      C.x = v[0];
      C.y = v[1];
      C.z = v[2];
      C.yaw = (v[3] || 0) * D2R;
      C.pitch = (v[4] || 0) * D2R;

    keys[e.code] = true;

    keys[e.code] = false;

    for (const k in keys) keys[k] = false;

    if (lookMode() && document.pointerLockElement !== canvas) canvas.requestPointerLock();

    if (e.button === 2 || e.button === 0 && !lookMode()) dragging = true;
    idleT = 0;

struct Parts { d: f32, rest: f32, can: f32, cdark: f32, clamp_: f32, lens: f32, tube: f32, wingD: f32 }

// cut a groove / pocket of plan-view shape g (negative inside) a fixed depth into any surface above ylo
fn carve(d: f32, g: f32, depth: f32, ylo: f32, y: f32) -> f32 { return smax(d, -max(max(g, -d - depth), ylo - y), 0.012); }

fn bump(x: f32, c: f32, wf: f32, wb: f32) -> f32 { let t = (x - c) / select(wb, wf, x > c); return exp(-t * t); }

// polygon distance for the half section (u = |z|, y); the closing edge on the symmetry plane only
// contributes to the sign so the field stays correct next to the centre line
fn sdSection(p: vec2f, v: array<vec2f, 8>) -> f32 {
  var vv = v;
  var d = 1e6;
  var s = 1.0;
  var j = 7;
  for (var i = 0; i < 8; i++) {
    let e = vv[j] - vv[i];
    let w = p - vv[i];
    let b = w - e * clamp(dot(w, e) / dot(e, e), 0.0, 1.0);
    if (j != 7 || i != 0) { d = min(d, dot(b, b)); }
    let c0 = p.y >= vv[i].y; let c1 = p.y < vv[j].y; let c2 = e.x * w.y > e.y * w.x;
    if ((c0 && c1 && c2) || (!c0 && !c1 && !c2)) { s = -s; }
    j = i;
  }
  return s * sqrt(d);
}

fn loftMain(q: vec3f) -> f32 {

    vec2f(0.0, B + r),
    vec2f(Wr * 0.72, B + r),
    vec2f(Wr * 0.94, B + 0.085),
    vec2f(Wr, B + (T - B) * 0.40),
    vec2f(Wr * 0.965, ysh + 0.01),
    vec2f(Wr * 0.76, tf - r),
    vec2f(Wr * 0.30, T - r - 0.022),
    vec2f(0.0, T - r + 0.004));
  var f = sdSection(vec2f(q.z, q.y), v) - r;
  f = smax(f, (q.x - 2.30) * 0.970 + (q.y - 0.09) * 0.242, 0.045);
  f = smax(f, -2.26 - q.x, 0.08);

fn loftCan(q: vec3f) -> f32 {
  let W = cWc(q.x); let T = cTc(q.x);

  let h = max(T - yb, 0.05);

fn sdfAt(p: vec3f) -> f32 {

  let tb = (bmax - p) * inv;

  let tmx = max(ta, tb);
  var t = max(max(tmn.x, max(tmn.y, tmn.z)), t0);

  if (te <= t) { return 1.0; }

  for (var i = 0; i < 44; i++) {
    let d = sdfAt(p + L * t);
    sh = min(sh, k * d / t);
    t += clamp(d * 0.85, 0.010, 0.30);

// ---- paint: clear coat over a metallic flake layer over a pigmented base ----
fn paintShade(base0: vec3f, flakeAmt0: f32, N0: vec3f, V: vec3f, ao: f32, lp: vec3f, wp: vec3f, fp: f32, sh: f32) -> vec3f {
  let L = E.sunDir.xyz;
  // road grime on the lowest panels
  let base = base0 * (1.0 - 0.45 * smoothstep(0.30, 0.10, wp.y));
  // orange peel: low-amplitude waviness of the coat that breaks up sharp reflections
  var N = N0;
  let pk = E.sc.x * (1.0 - smoothstep(0.0012, 0.0040, fp));
  if (pk > 0.001) {
    let q = lp * 150.0;
    let g = vec3f(vnoise3(q), vnoise3(q + vec3f(19.1, 7.3, 3.7)), vnoise3(q + vec3f(41.7, 11.9, 29.3))) - 0.5
          + (vec3f(vnoise3(q * 2.9 + 5.0), vnoise3(q * 2.9 + 23.0), vnoise3(q * 2.9 + 61.0)) - 0.5) * 0.6;
    N = normalize(N0 + (g - N0 * dot(g, N0)) * 0.07 * pk);
  }

  let dfade = E.sc.w * (1.0 - smoothstep(0.0012, 0.0032, fp)) * smoothstep(0.05, 0.6, N0.y);
  if (dfade > 0.01) {

    let cf = fract(uvd) - 0.5;
    let rn = hash22(cid);
    let off = cf - (rn - 0.5) * 0.45;
    let rad = mix(0.05, 0.18, rn.x * rn.y);
    let dd = length(off) / rad;
    if (dd < 1.0 && hash12(cid + 7.0) < 0.38 * dfade) {

      N = normalize(N + (pr.a * off.x + pr.b * off.y) / rad * 0.55 * bulge);
    }

  let R = reflect(-V, N);
  let fc = fres(ndv, 0.04);
  let so = mix(1.0, ao, 0.75);
  // coat reflection: crisp environment plus the sun, which the car's own shape can shadow
  let coat = (envC(R, 0.025) + sunLobe(R, 0.025) * sh) * fc * so;
  // metallic flakes: random micro-facets inside the base coat
  let cell = floor(wp * 1500.0);
  let hv = hash33(cell);
  let nf = normalize(N + (hv - 0.5) * 0.9);
  let flakeAmt = flakeAmt0 * (1.0 - smoothstep(0.0008, 0.0030, fp));

  let f0m = base * 0.9 + vec3f(0.03);
  let metal = f0m * (envC(Rb, 0.22) + sunLobe(Rb, 0.22) * sh) * mf;
  let ndl = sat(dot(N, L));
  let diff = base * (irr(N) * ao + E.sunCol.rgb * SUN_E * ndl * sh / PI) * (1.0 - mf);
  // grazing sheen of the pigmented layer
  let sheen = base * envC(R, 0.6) * pow(1.0 - ndv, 3.0) * 0.4;

// projection frame for procedural surface patterns, by dominant normal axis
struct Proj { uv: vec2f, a: vec3f, b: vec3f }
fn projOf(lp: vec3f, N: vec3f) -> Proj {
  let an = abs(N);
  if (an.y > an.x && an.y > an.z) { return Proj(lp.xz, vec3f(1, 0, 0), vec3f(0, 0, 1)); }
  if (an.x > an.z) { return Proj(lp.zy, vec3f(0, 0, 1), vec3f(0, 1, 0)); }
  return Proj(lp.xy, vec3f(1, 0, 0), vec3f(0, 1, 0));
}

fn carbonShade(N0: vec3f, V: vec3f, ao: f32, lp: vec3f, fp: f32, sh: f32) -> vec3f {
  let pr = projOf(lp, N0);
  let tow = 0.0042;
  let g = pr.uv / tow;
  let ci = floor(g); let f = fract(g);
  let k = (i32(ci.x) + i32(ci.y)) & 3;
  let vert = k < 2;
  let s = select(f.y, f.x, vert);
  let lod = 1.0 - smoothstep(0.0008, 0.0035, fp);
  let tilt = cos(PI * s) * 0.55 * lod;
  let Nw = normalize(N0 + select(pr.b, pr.a, vert) * tilt);
  let ndv = max(dot(N0, V), 1e-3);
  let R = reflect(-V, N0);
  let Rw = reflect(-V, Nw);
  let fc = fres(ndv, 0.04);
  let so = mix(1.0, ao, 0.75);
  let fibre = mix(1.0, 0.55 + 0.45 * sin(PI * s), lod);
  let L = E.sunDir.xyz;
  let diff = vec3f(0.012) * fibre * (irr(N0) * ao + E.sunCol.rgb * SUN_E * sat(dot(N0, L)) * sh / PI);
  let sheen = (envC(Rw, 0.42) + sunLobe(Rw, 0.42) * sh) * 0.14 * fibre;
  return (envC(R, 0.03) + sunLobe(R, 0.03) * sh) * fc * so + (1.0 - fc) * (diff + sheen * so);
}

// ---- cabin seen through the glass: a handful of boxes in car space, ray-cast from the eye ----
fn boxHit(ro: vec3f, rd: vec3f, c: vec3f, h: vec3f) -> vec4f {
  let m = 1.0 / (rd + select(vec3f(1e-5), vec3f(-1e-5), rd < vec3f(0.0)));
  let n = m * (ro - c);
  let k = abs(m) * h;
  let t1 = -n - k;
  let t2 = -n + k;
  let tN = max(max(t1.x, t1.y), t1.z);
  let tF = min(min(t2.x, t2.y), t2.z);
  if (tN > tF || tF < 0.0) { return vec4f(-1.0); }
  let nor = -sign(rd) * step(t1.yzx, t1.xyz) * step(t1.zxy, t1.xyz);
  return vec4f(max(tN, 0.0), nor);
}
fn cabin(ro: vec3f, rd: vec3f) -> vec3f {
  var best = 1e3;

    vec4f(0.80, 0.66, 0.0, 0.0), vec4f(0.62, 0.77, 0.30, 0.0), vec4f(0.05, 0.40, 0.0, 0.0),
    vec4f(-0.06, 0.38, 0.30, 0.0), vec4f(-0.06, 0.38, -0.30, 0.0),
    vec4f(-0.30, 0.64, 0.30, 0.0), vec4f(-0.30, 0.64, -0.30, 0.0),
    vec4f(-0.37, 0.95, 0.30, 0.0), vec4f(-0.37, 0.95, -0.30, 0.0),
    vec4f(0.0, 0.46, 0.80, 0.0), vec4f(0.0, 0.46, -0.80, 0.0), vec4f(-0.58, 0.70, 0.0, 0.0));
  var hh = array<vec3f, 12>(
    vec3f(0.17, 0.10, 0.70), vec3f(0.09, 0.05, 0.20), vec3f(0.60, 0.18, 0.075),
    vec3f(0.25, 0.07, 0.19), vec3f(0.25, 0.07, 0.19),
    vec3f(0.065, 0.31, 0.19), vec3f(0.065, 0.31, 0.19),
    vec3f(0.055, 0.10, 0.12), vec3f(0.055, 0.10, 0.12),
    vec3f(0.95, 0.30, 0.025), vec3f(0.95, 0.30, 0.025), vec3f(0.03, 0.50, 0.75));
  for (var i = 0; i < 12; i++) {
    let h = boxHit(ro, rd, vec3f(hs[i].x, hs[i].y, hs[i].z), hh[i]);

  if (rd.y < -1e-3) { let t = (0.22 - ro.y) / rd.y; if (t > 0.0 && t < best) { best = t; nrm = vec3f(0.0, 1.0, 0.0); mat = 21.0; } }
  if (best > 50.0) { return vec3f(0.002); }

  if (mat == 0.0 || mat == 1.0) { alb = vec3f(0.012, 0.012, 0.014); }
  if (mat >= 3.0 && mat <= 8.0) { alb = vec3f(0.085, 0.045, 0.028) * (0.85 + 0.3 * step(0.5, fract(p.y * 22.0))); }   // quilted seats
  if (mat == 20.0) { alb = vec3f(0.020); }

}

fn glassShade(N: vec3f, V: vec3f, ao: f32, sh: f32, wp: vec3f) -> vec3f {
  let ndv = max(dot(N, V), 1e-3);
  let R = reflect(-V, N);
  let fg = fres(ndv, 0.07);
  let tint = vec3f(0.34, 0.38, 0.42);
  let inside = cabin(wp - V * 0.004, -V) * tint + E.hor.rgb * 0.004 * (1.0 - ndv);
  return (envC(R, 0.012) + sunLobe(R, 0.012) * sh) * fg + (1.0 - fg) * inside * mix(0.6, 1.0, ao);
}

fn cavShade(N: vec3f, V: vec3f, ao: f32, lp: vec3f) -> vec3f {
  let pr = projOf(lp, N);
  let q = pr.uv * (TAU / 0.011);
  let f = cos(q.x) + cos(dot(q, vec2f(-0.5, 0.866))) + cos(dot(q, vec2f(-0.5, -0.866)));
  let hole = smoothstep(1.2, 1.9, f);
  let mesh = 1.0 - hole;
  let R = reflect(-V, N);
  let rib = 0.55 + 0.45 * sin(lp.y * 150.0);
  return vec3f(0.004) * (0.3 + hole) + mesh * (envC(R, 0.5) * 0.03 + vec3f(0.014) * irr(N)) * ao * rib;

fn gapLines(lp: vec3f, N: vec3f, fp: f32) -> f32 {
  var d = 1e3;
  let sideF = smoothstep(0.4, 0.7, abs(N.z));
  let topF = smoothstep(0.4, 0.7, N.y);
  // door outline
  let q2 = vec2f(lp.x - 0.19, lp.y - 0.55);
  let dd = abs(q2) - vec2f(0.58, 0.245);
  let sdDoor = length(max(dd, vec2f(0.0))) + min(max(dd.x, dd.y), 0.0);
  d = min(d, mix(1e3, abs(sdDoor), sideF * smoothstep(0.7, 0.8, abs(lp.z))));

  let hp = vec2f(lp.x, abs(lp.z));
  var hl = seg2(hp, vec2f(1.14, 0.0), vec2f(1.14, 0.60));
  hl = min(hl, seg2(hp, vec2f(1.14, 0.60), vec2f(1.72, 0.58)));
  hl = min(hl, seg2(hp, vec2f(1.72, 0.58), vec2f(1.98, 0.36)));
  hl = min(hl, seg2(hp, vec2f(1.98, 0.36), vec2f(2.21, 0.32)));
  hl = min(hl, seg2(hp, vec2f(2.21, 0.32), vec2f(2.23, 0.0)));
  d = min(d, mix(1e3, hl, topF));
  let eq = abs(vec2f(lp.x + 1.40, abs(lp.z))) - vec2f(0.46, 0.60);
  d = min(d, mix(1e3, abs(length(max(eq, vec2f(0.0))) + min(max(eq.x, eq.y), 0.0)), topF));

}

struct VIn {

  @location(4) i0: vec4f, @location(5) i1: vec4f, @location(6) i2: vec4f, @location(7) i3: vec4f,

struct VOut {
  @builtin(position) clip: vec4f,
  @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) m1: vec4f, @location(3) m2: vec4f,

@vertex fn cvs(v: VIn) -> VOut {

  o.n = normalize((M * vec4f(v.nrm, 0.0)).xyz);

  o.lp = v.pos; o.ln = v.nrm;

}

  let gap = gapLines(in.lp, N, fp);
  var col = paintShade(E.paint.rgb, E.paint.w, N, V, ao, in.lp, in.wp, fp, sh);
  col = mix(col, carbonShade(N, V, ao, in.lp, fp, sh), carbon);
  col *= mix(1.0, 0.30, gap * (1.0 - glass));
  if (trim > 0.01) { col = mix(col, paintShade(vec3f(0.006), 0.0, N, V, ao, in.lp, in.wp, fp, sh), trim); }
  if (tubeM > 0.01) {
    // titanium exhaust tips: heat-tinted towards the outlet, sooty inside
    let heat = smoothstep(-2.36, -2.26, in.lp.x);
    let ti = mix(vec3f(0.30, 0.28, 0.27), vec3f(0.32, 0.22, 0.45), heat);
    let rr = (envC(reflect(-V, N), 0.18) + sunLobe(reflect(-V, N), 0.18) * sh);
    col = mix(col, ti * rr * 1.2 * ao + ti * irr(N) * 0.1, tubeM);
  }
  if (glass > 0.01) { col = mix(col, glassShade(N, V, ao, sh, in.wp), glass); }
  if (cav > 0.01) { col = mix(col, cavShade(N, V, ao, in.lp), cav); }
  // headlamps: dark glossy housing, crisp DRL blade and projector painted from their plan-view shapes
  let hs = headShapes(vec2f(in.lp.x, abs(in.lp.z)));
  let topF = smoothstep(0.15, 0.45, in.ln.y) * step(0.28, in.lp.y) * step(1.7, in.lp.x);
  let aa = max(fp * 1.1, 0.0005);
  let hous = (1.0 - smoothstep(-aa, aa, hs.x)) * topF;
  if (hous > 0.01) {
    let ndvh = max(dot(N, V), 1e-3);
    let hg = (envC(reflect(-V, N), 0.02) + sunLobe(reflect(-V, N), 0.02) * sh) * fres(ndvh, 0.06) + vec3f(0.003, 0.004, 0.006);
    col = mix(col, hg, hous);
    let drl = (1.0 - smoothstep(0.0, aa * 1.5, hs.y)) * topF;
    let prj = (1.0 - smoothstep(0.0, aa * 1.5, hs.z)) * topF;
    let glow = vec3f(0.85, 0.93, 1.0) * (0.3 + 14.0 * E.opts.x);
    col = mix(col, glow, drl);
    col = mix(col, glow * 1.4 + vec3f(0.1), prj * 0.85);
  }
  if (lamp > 0.01) {
    let ndv = max(dot(N, V), 1e-3);
    let lens = envC(reflect(-V, N), 0.02) * fres(ndv, 0.05);
    var em: vec3f;
    if (in.lp.x > 0.0) { em = vec3f(0.85, 0.93, 1.0) * (0.25 + 12.0 * E.opts.x); }
    else { em = vec3f(1.0, 0.025, 0.012) * (1.2 + 9.0 * (0.35 + 0.65 * E.opts.x)); }
    col = mix(col, em + lens, lamp);
  }
  return col;
}

// pseudo lettering on the tyre sidewall: blocks of a 3x5 grid, switched on by a hash
fn sidewallText(r: f32, ang: f32) -> f32 {
  let v = (r - 0.268) / 0.017;
  if (v < 0.0 || v > 1.0) { return 0.0; }
  let arc = ang * r;
  let id = floor(arc / 0.0100);
  let cu = fract(arc / 0.0100);
  let gx = floor(cu * 3.0);
  let gy = floor(v * 5.0);
  let on = step(0.50, hash12(vec2f(id * 1.37, gx + 3.0 * gy + 11.0 * floor(id * 0.37)))) * step(0.12, cu) * step(cu, 0.9) * step(0.10, fract(v * 5.0));
  let word = step(abs(ang - 0.45), 0.5) + step(abs(ang + 2.15), 0.42);
  return on * clamp(word, 0.0, 1.0);
}

fn wheelColor(in: VOut) -> vec3f {
  let V = viewVec(in.wp);
  var N = normalize(in.n);
  if (dot(N, V) < 0.0) { N = -N; }
  let fp = length(fwidth(in.wp));
  let rim = smoothstep(0.4, 0.6, in.m1.x);
  let tire = smoothstep(0.4, 0.6, in.m1.y);
  let disc = smoothstep(0.4, 0.6, in.m1.z);
  let cal = smoothstep(0.4, 0.6, in.m1.w);
  let lp = in.lp;
  let r = length(lp.xy);
  let ang = atan2(lp.y, lp.x);
  var ao = in.m2.x * mix(0.18, 1.0, smoothstep(0.62, 0.20, in.wp.y)) * mix(0.55, 1.0, smoothstep(0.0, 0.2, in.wp.y));
  let L = E.sunDir.xyz;
  var sh = 0.0;
  if (dot(N, L) > -0.1 && L.y > -0.02) { sh = carShadow(in.wp + N * 0.02, L, E.sc.y, 0.0); }
  let ndv = max(dot(N, V), 1e-3);
  let R = reflect(-V, N);
  var col: vec3f;
  if (tire > 0.5 && rim < 0.5) {
    let onTread = smoothstep(0.65, 0.35, abs(in.ln.z));
    let lod = 1.0 - smoothstep(0.002, 0.008, fp);
    let gz = abs(abs(lp.z) - 0.045);
    let g1 = 1.0 - smoothstep(0.004, 0.006, gz);
    let g2 = 1.0 - smoothstep(0.004, 0.006, abs(abs(lp.z) - 0.105));
    let sipe = smoothstep(0.42, 0.49, abs(fract(ang * 56.0 / TAU + lp.z * 6.0) - 0.5));
    let groove = max(max(g1, g2) * onTread, sipe * onTread * 0.55) * lod;
    let rings = 0.5 + 0.5 * sin(r * 520.0);
    let side = (1.0 - onTread) * lod;
    var alb = vec3f(0.020) * (1.0 - 0.7 * groove) * (1.0 - 0.18 * rings * side);
    // lettering and a moulded rim-protector ridge on the outer sidewall
    let outer = step(0.05, lp.z) * (1.0 - onTread);
    let txt = sidewallText(r, ang) * outer * lod;
    let ridge = exp(-pow((r - 0.258) / 0.004, 2.0)) * outer;
    alb = alb * (1.0 - 0.0) + vec3f(0.07, 0.07, 0.065) * txt + vec3f(0.03) * ridge;
    // road dust / brake dust, heavier low and near the rim
    let dust = smoothstep(0.30, 0.25, r) * 0.012 * outer;
    alb += vec3f(dust, dust * 0.9, dust * 0.8);
    col = alb * (irr(N) * ao + E.sunCol.rgb * SUN_E * sat(dot(N, L)) * sh / PI) + (envC(R, 0.58) + sunLobe(R, 0.58) * sh) * fres(ndv, 0.04) * 0.3 * mix(1.0, ao, 0.8) * (1.0 - 0.8 * groove);
  } else if (rim > 0.5 || (tire <= 0.5 && disc <= 0.5 && cal <= 0.5)) {
    // wheel: satin graphite face with a diamond-cut polished lip and a machined spoke edge
    let lip = smoothstep(0.236, 0.246, r) * smoothstep(0.06, 0.13, lp.z);
    let brush = 0.85 + 0.15 * hash11(floor(r * 900.0)) + 0.1 * hash11(floor(ang * 160.0));
    let graphite = vec3f(0.055, 0.056, 0.060) * brush;
    let alu = vec3f(0.82, 0.80, 0.77);
    let f0 = mix(graphite, alu, lip);
    let rough = mix(0.30, 0.10, lip);
    let spec = (envC(reflect(-V, N), rough) + sunLobe(reflect(-V, N), rough) * sh);
    col = f0 * spec * mix(1.0, ao, 0.85) + graphite * irr(N) * ao * 0.35 * (1.0 - lip)
        + (envC(R, 0.03) + sunLobe(R, 0.03) * sh) * fres(ndv, 0.04) * 0.6 * ao;
    // spoke sides and hub are lit like dark anodised metal; centre cap badge ring
    let cap = smoothstep(0.034, 0.030, r) * step(0.10, lp.z);
    col = mix(col, vec3f(0.5, 0.05, 0.04) * spec * 0.5, cap * smoothstep(0.014, 0.010, abs(r - 0.022)));
  } else if (disc > 0.5) {
    let brushd = 0.80 + 0.2 * hash11(floor(r * 1400.0));
    var bc = vec3f(0.30, 0.29, 0.28) * brushd;
    if (r < 0.118) { bc = vec3f(0.035); }
    col = bc * (envC(R, 0.32) + sunLobe(R, 0.32) * sh) * mix(1.0, ao, 0.8) * 1.0 + bc * irr(N) * ao * 0.12;
    // heat-darkened outer edge
    col *= mix(1.0, 0.7, smoothstep(0.17, 0.188, r));
  } else {
    // caliper: gloss red enamel with a lettering strip
    var c0 = paintShade(vec3f(0.60, 0.010, 0.008), 0.0, N, V, ao, in.lp, in.wp, fp, sh);
    let strip = step(abs(lp.x + 0.012), 0.016) * step(0.0, lp.z);
    col = c0;
  }
  return col;
}

fn wheelDiscard(in: VOut) {
  let disc = smoothstep(0.4, 0.6, in.m1.z);
  let lp = in.lp;
  let r = length(lp.xy);
  let ang = atan2(lp.y, lp.x);
  if (disc > 0.5 && r > 0.12 && r < 0.186) {
    let stp = TAU / 28.0;
    let row = select(0.136, 0.168, (i32(floor(ang / stp)) & 1) == 0);
    let a2 = (fract(ang / stp) - 0.5) * stp * r;
    if (length(vec2f(a2, r - row)) < 0.0056) { discard; }
  }
}

@fragment fn fs_body(in: VOut) -> @location(0) vec4f { return vec4f(bodyColor(in), 1.0); }

// closest distance between a ray (ro, unit rd) and a segment a..b; y = ray parameter at the closest point
fn raySeg(ro: vec3f, rd: vec3f, a: vec3f, b: vec3f) -> vec2f {
  let v = b - a;
  let w0 = ro - a;
  let bb = dot(rd, v); let cc = dot(v, v); let dd = dot(rd, w0); let ee = dot(v, w0);
  let den = max(cc - bb * bb, 1e-6);
  var s = clamp((ee - bb * dd) / den, 0.0, 1.0);
  let t = max((bb * s - dd), 0.0);
  return vec2f(length(ro + rd * t - (a + v * s)), t);
}
@fragment fn fs_sky(in: VO) -> @location(0) vec4f {
  let d = camRay(cam, in.pos.xy);
  var c = skyBase(d, 0.0) + sunLobe(d, 0.0);
  if (E.opts2.z > 0.001 && d.y < 0.5) {
    for (var i = 0; i < 20; i++) {
      let lp = lampPos(i);
      let v = lp - cam.pos.xyz;
      let dl = length(v);
      let cs = dot(d, v / dl);
      let ang = acos(clamp(cs, -1.0, 1.0));
      let head = 0.20 / dl;
      c += LAMP_COL * (smoothstep(head * 1.4, head * 0.6, ang) * 140.0 + exp(-ang * ang / (head * head * 40.0)) * 3.0 + exp(-ang * ang / (head * head * 1400.0)) * 0.45) * E.opts2.z;
      // pole and arm: distance between the view ray and each segment
      let base = vec3f(lp.x, 0.0, lp.z + sign(lp.z) * 1.6);
      let top = vec3f(base.x, 8.0, base.z);
      let pxA = max(dl * length(cam.up.xyz) * 2.0 * cam.res.w, 1e-4);
      let c1 = raySeg(cam.pos.xyz, d, base, top);
      let c2 = raySeg(cam.pos.xyz, d, top, lp + vec3f(0.0, 0.05, 0.0));
      let cov = max(1.0 - smoothstep(0.07, 0.07 + pxA * 1.2, c1.x), 1.0 - smoothstep(0.035, 0.035 + pxA * 1.2, c2.x));
      c = mix(c, vec3f(0.004, 0.004, 0.006), cov * step(0.0, d.y + 0.02) * step(0.0, c1.y));
    }
  }
  return vec4f(c, 1.0);
}

struct GV { @builtin(position) clip: vec4f, @location(0) wp: vec3f }
@vertex fn gvs(@builtin(vertex_index) i: u32) -> GV {
  var p = array<vec2f, 6>(vec2f(-1, -1), vec2f(1, -1), vec2f(1, 1), vec2f(-1, -1), vec2f(1, 1), vec2f(-1, 1));
  let w = vec3f(cam.pos.x + p[i].x * 4000.0, 0.0, cam.pos.z + p[i].y * 4000.0);
  var o: GV;
  o.clip = cam.viewProj * vec4f(w - cam.pos.xyz, 1.0);

}
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
fn screenUV(q: vec3f) -> vec2f {
  let c = cam.viewProj * vec4f(q - cam.pos.xyz, 1.0);
  let n = c.xy / max(c.w, 1e-4);
  return vec2f(n.x * 0.5 + 0.5, 0.5 - n.y * 0.5);
}

// distance-to-border of a cellular pattern: sealed cracks and expansion seams in the asphalt
fn cellEdge(p: vec2f) -> f32 {
  let ip = floor(p); let f = fract(p);
  var d1 = 8.0; var d2 = 8.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      let g = vec2f(f32(x), f32(y));
      let r = g + hash22(ip + g) - f;
      let d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
    }
  }
  return sqrt(d2) - sqrt(d1);
}

@fragment fn gfs(in: GV) -> @location(0) vec4f {
  let p = in.wp;
  let toCam = cam.pos.xyz - p;
  let dcam = length(toCam);
  let V = toCam / dcam;
  let L = E.sunDir.xyz;
  let fpx = length(fwidth(p.xz));
  let sc = vec2f(p.x + E.opts2.x, p.z);
  // asphalt: aggregate, patches, sealed cracks
  let agg = vnoise2(sc * 220.0);
  let agg2 = vnoise2(sc * 61.0);
  let stains = fbm2(sc * 0.7, 4);
  var alb = vec3f(0.052, 0.050, 0.049) * (0.50 + 0.95 * stains) * mix(0.75, 1.25, agg) * mix(0.9, 1.1, agg2);
  let speck = step(0.93, hash12(floor(sc * 160.0))) * (1.0 - smoothstep(0.004, 0.02, fpx));
  alb += vec3f(0.06) * speck;
  let cw = cellEdge(sc * 0.42 + (vec2f(vnoise2(sc * 3.1), vnoise2(sc * 3.1 + 9.0)) - 0.5) * 0.5);
  let crackOn = step(0.74, hash12(floor(sc * 0.42) + 3.0));
  let crack = (1.0 - smoothstep(0.0, 0.006 + fpx * 0.6, cw)) * crackOn;
  let patchM = smoothstep(0.55, 0.60, fbm2(sc * 0.18 + vec2f(40.0, 5.0), 3));
  alb *= 1.0 - 0.55 * crack;

  let dash = step(fract(sc.x / 9.0), 0.33);
  let ln1 = (1.0 - smoothstep(0.06, 0.06 + fpx * 1.5, abs(abs(p.z) - 3.6))) * dash;
  let ln2 = 1.0 - smoothstep(0.08, 0.08 + fpx * 1.5, abs(abs(p.z) - 7.2));
  let paintM = max(ln1, ln2) * (0.45 + 0.4 * stains) * (0.55 + 0.45 * agg) * (1.0 - 0.5 * crack);
  alb = mix(alb, vec3f(0.55, 0.53, 0.48), paintM);
  // shoulders: wet grass and gravel outside the lane edge lines
  let shoulder = smoothstep(8.2, 8.9, abs(p.z));
  let gr = fbm2(sc * 3.0, 4);
  let fieldB = smoothstep(0.45, 0.55, fbm2(vec2f(sc.x * 0.012, p.z * 0.03), 3));
  let grass = mix(vec3f(0.010, 0.022, 0.006), vec3f(0.024, 0.026, 0.008), fieldB) * (0.4 + 1.3 * gr) * mix(0.35, 1.7, vnoise2(sc * 40.0)) * mix(0.55, 1.45, vnoise2(sc * 5.0)) * mix(0.7, 1.3, vnoise2(sc * 0.9)) * mix(0.75, 1.15, 0.5 + 0.5 * sin(p.z * 2.2 + 3.0 * vnoise2(sc * 0.05))) * mix(1.0, 0.8, fieldB);

  let wetN = fbm2(sc * 0.32 + vec2f(3.1, 7.7), 5);
  let puddle = max(smoothstep(0.47, 0.55, wetN), crack * 0.35) * (1.0 - shoulder);
  let wet = clamp(puddle * 0.9 + 0.40, 0.0, 1.0) * (1.0 - 0.9 * shoulder);
  let wetAlb = alb * mix(1.0, 0.42, wet);
  // surface normal: aggregate micro-bumps (damp asphalt) vs. almost flat water, plus a gentle warp
  let rough0 = mix(mix(0.42, 0.85, shoulder), 0.045, puddle);
  let mf = 1.0 - smoothstep(0.002, 0.014, fpx);
  let e = 0.0025;
  let h0 = vnoise2(sc * 220.0);
  let hx = vnoise2((sc + vec2f(e, 0.0)) * 220.0);
  let hz = vnoise2((sc + vec2f(0.0, e)) * 220.0);
  let bump = vec2f(h0 - hx, h0 - hz) * (1.0 - puddle) * 0.32 * mf;
  let warp = vec2f(vnoise2(sc * 2.3 + 11.0), vnoise2(sc * 2.3 + 71.0)) - 0.5;
  let warp2 = vec2f(vnoise2(sc * 9.0 + 3.0), vnoise2(sc * 9.0 + 33.0)) - 0.5;
  let nlow = (warp * 0.006 + warp2 * 0.003) * mix(0.5, 1.0, puddle);
  let N = normalize(vec3f(bump.x + nlow.x, 1.0, bump.y + nlow.y));

  var sh = 1.0;
  if (L.y > 0.0) { sh = carShadow(p + vec3f(0.0, 0.01, 0.0), L, E.sc.y, 0.05); }

  let diff = wetAlb * (irr(vec3f(0.0, 1.0, 0.0)) * ao + sunD);

  let R = reflect(-V, N);
  var Rg = R;
  Rg.y = max(Rg.y, 0.0005);

  // mirrored car: contact-hardening blur, rotated taps through the mip chain
  let uv0 = vec2f(in.clip.x * cam.res.z, in.clip.y * cam.res.w);
  let base0 = textureSampleLevel(reflB, sampL, uv0, 0.0);
  let pxPerM = cam.res.y / (2.0 * length(cam.up.xyz) * dcam);

  let q = p + vec3f(N.x, 0.0, N.z) * reach * 2.2;

  let blurPx = (rough * rough * 2.2 + 0.004) * (0.15 + reach * 0.9) * E.sc.z * pxPerM;
  var acc = vec4f(0.0);
  if (blurPx < 0.8) {
    acc = textureSampleLevel(reflA, sampL, uv, 0.0);
  } else {
    let lodT = clamp(log2(max(blurPx * 0.4, 1.0)), 0.0, 6.0);
    let rot = ign(in.clip.xy) * TAU;
    for (var i = 0; i < 12; i++) {
      let rr = sqrt((f32(i) + 0.5) / 12.0) * blurPx;
      let ang = f32(i) * 2.39996 + rot;
      acc += textureSampleLevel(reflA, sampL, uv + vec2f(cos(ang), sin(ang)) * rr * cam.res.zw, lodT);
    }
    acc /= 12.0;
  }
  let cov = clamp(acc.a, 0.0, 1.0);
  let carR = acc.rgb / max(cov, 1e-3);
  let refl = mix(skyR, carR, smoothstep(0.0, 1.0, cov));
  var col = diff * (1.0 - F) + refl * F;
  // distance haze toward the horizon
  let far = smoothstep(300.0, 2500.0, length(p.xz - cam.pos.xz));
  col = mix(col, skyBase(normalize(vec3f(-V.x, 0.002, -V.z)), 0.3), far);
  return vec4f(col, 1.0);
}

    const W = eng.W, H = eng.H;
    const levels = Math.min(8, Math.floor(Math.log2(Math.max(W, H))) + 1);
    const mk = (label) => dev.createTexture({ size: [W, H], format: eng.HDR, mipLevelCount: levels, usage: TU2.RENDER_ATTACHMENT | TU2.TEXTURE_BINDING, label });
    const a = mk("mirror color"), b = mk("mirror height");
    const depth = dev.createTexture({ size: [W, H], format: eng.DEPTH, usage: TU2.RENDER_ATTACHMENT, label: "mirror depth" });
    const lv = (t, l) => t.createView({ baseMipLevel: l, mipLevelCount: 1 });
    const chain = (t) => {
      const out = [];
      for (let l = 1; l < levels; l++) {
        out.push({ view: lv(t, l), bg: dev.createBindGroup({ layout: this.pMip2d.getBindGroupLayout(0), entries: [{ binding: 0, resource: lv(t, l - 1) }, { binding: 1, resource: eng.sampClamp }] }) });
      }
      return out;
    };
    this.mirror = { a, b, depth, levels, viewA: a.createView(), viewB: b.createView(), v0A: lv(a, 0), v0B: lv(b, 0), depthView: depth.createView(), chainA: chain(a), chainB: chain(b) };
    this.makeGroups(eng, this.mirror);
  },
  // wheel/caliper model matrices: translate * scale(mirror in z) * rotZ(spin)
  writeMatrices(spin) {
    for (let i = 0; i < 4; i++) {
      const w = WHEELS[i];
      const sz = w.z < 0 ? -1 : 1;
      const a = -spin, c = Math.cos(a) * w.s, s = Math.sin(a) * w.s;
      this.wheelM.set([c, s, 0, 0, -s, c, 0, 0, 0, 0, w.s * sz, 0, w.x, WHEEL_R * w.s, w.z, 1], i * 16);
      this.calM.set([w.s, 0, 0, 0, 0, w.s, 0, 0, 0, 0, w.s * sz, 0, w.x, WHEEL_R * w.s, w.z, 1], i * 16);
    }
  },
  async onParam(key, eng) {
    if (key === "rimStyle" && eng.P.rimStyle !== this.lastStyle) {
      this.lastStyle = eng.P.rimStyle;
      const m = await meshFromPart(eng, WHEEL_PART, { min: [-0.38, -0.38, -0.18], max: [0.38, 0.38, 0.18], h: 6e-3, band: 0.025, style: eng.P.rimStyle, label: "wheel" });
      this.mWheel.vb.destroy();
      this.mWheel.ib.destroy();
      this.mWheel = { vb: eng.bufFrom(m.verts, GU2.VERTEX, "wheel vb"), ib: eng.bufFrom(m.indices, GU2.INDEX, "wheel ib"), count: m.indices.length };
    }
  },
  update(eng, dt) {
    const P = eng.P, C = eng.cam;
    C.maxPitch = Math.asin(clamp((C.target[1] - 0.16) / C.dist, -1, 1));
    if (C.pitch > C.maxPitch) C.pitch = C.maxPitch;
    this.spin += dt * P.wheelSpeed * Math.PI * 2;
    this.scroll += dt * P.wheelSpeed * Math.PI * 2 * WHEEL_R * 1.02;
    this.writeMatrices(this.spin);
    eng.queue.writeBuffer(this.instWheel, 0, this.wheelM);
    const e = P.sunElev, az = P.sunAzim * D2R2, er = e * D2R2;
    const t = clamp(e / 35, 0, 1);
    const dim = 0.25 + 0.75 * sstep(-3, 10, e);
    const sunCol = mix([1, 0.4, 0.12], [1, 0.93, 0.82], Math.pow(t, 0.6)).map((v) => v * dim);
    const day = clamp((e + 6) / 40, 0, 1);
    const zen = mix([0.012, 0.025, 0.075], [0.085, 0.19, 0.48], Math.pow(day, 0.8));
    let hor = mix([0.07, 0.05, 0.09], [1.25, 0.52, 0.2], sstep(-5, 3, e));
    hor = mix(hor, [0.6, 0.7, 0.85], sstep(8, 40, e));
    const paint = hsl(P.hue, 0.8, P.light);
    const f = this.env;
    f.set([Math.cos(er) * Math.cos(az), Math.sin(er), Math.cos(er) * Math.sin(az), 0], 0);
    f.set([...sunCol, er], 4);
    f.set([...zen, 0], 8);
    f.set([...hor, day], 12);
    f.set([...paint, P.flake], 16);
    f.set([P.headlights, P.floorRefl, P.rimStyle, 0], 20);
    f.set([this.scroll, eng.time, P.lamps * (1 - 0.6 * sstep(8, 30, e)), 0], 24);
    f.set([SDF_ORG[0], SDF_ORG[1], SDF_ORG[2], 0], 28);
    f.set([1 / (SDF_DIMS[0] * SDF_CELL), 1 / (SDF_DIMS[1] * SDF_CELL), 1 / (SDF_DIMS[2] * SDF_CELL), 0], 32);
    f.set([P.peel * 0.8, 60, 1, P.drops], 36);
    f[23] = 0;
    eng.queue.writeBuffer(this.uboN, 0, f);
    f[23] = 1;
    eng.queue.writeBuffer(this.uboM, 0, f);
    this.envKeyNow = [P.sunElev, P.sunAzim, P.lamps].join(",");
    if (qs.get("perf")) {
      const n = performance.now();
      if (this.perfT) {
        this.perfAcc = (this.perfAcc || 0) + (n - this.perfT);
        this.perfN = (this.perfN || 0) + 1;
      }
      this.perfT = n;
      if (this.perfN === 120) {
        fetch("/__log", { method: "POST", body: `perf ${(this.perfAcc / 120).toFixed(2)} ms/frame` });
        this.perfN = 0;
        this.perfAcc = 0;
      }
    }
  },
  // bake + prefilter the environment when the sky changed, then render the mirrored car
  compute(eng, enc) {
    const dev = eng.device;
    if (this.envKeyNow !== this.envKey) {
      this.envKey = this.envKeyNow;
      for (let f = 0; f < 6; f++) {
        const p = enc.beginRenderPass({ colorAttachments: [{ view: this.envFace[0][f], loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "store" }] });
        p.setPipeline(this.pBake);
        p.setBindGroup(0, dev.createBindGroup({ layout: this.pBake.getBindGroupLayout(0), entries: [{ binding: 1, resource: { buffer: this.uboN } }] }));
        p.draw(3, 1, 0, f);
        p.end();
      }
      for (let l = 1; l < ENV_MIPS; l++) {
        for (let f = 0; f < 6; f++) {
          const p = enc.beginRenderPass({ colorAttachments: [{ view: this.envFace[l][f], loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "store" }] });
          p.setPipeline(this.pEnvMip);
          p.setBindGroup(0, this.envMipBG[l]);
          p.draw(3, 1, 0, f);
          p.end();
        }
      }
    }
    const m = this.mirror;
    if (!m || (qs.get("off") || "").includes("mirror")) return;
    const rp = enc.beginRenderPass({
      colorAttachments: [
        { view: m.v0A, loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 0 }, storeOp: "store" },
        { view: m.v0B, loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 0 }, storeOp: "store" }
      ],
      depthStencilAttachment: { view: m.depthView, depthClearValue: 0, depthLoadOp: "clear", depthStoreOp: "discard" }
    });
    this.drawCar(rp, true);
    rp.end();
    for (const chain of [m.chainA, m.chainB]) {
      for (const lvl of chain) {
        const p = enc.beginRenderPass({ colorAttachments: [{ view: lvl.view, loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 0 }, storeOp: "store" }] });
        p.setPipeline(this.pMip2d);
        p.setBindGroup(0, lvl.bg);
        p.draw(3);
        p.end();
      }
    }
  },
  drawCar(rp, mirror) {
    rp.setBindGroup(0, mirror ? this.bgMirror : this.bgMain);
    rp.setPipeline(mirror ? this.pBodyM : this.pBody);
    rp.setVertexBuffer(0, this.mBody.vb);
    rp.setVertexBuffer(1, this.instBody);
    rp.setIndexBuffer(this.mBody.ib, "uint32");
    rp.drawIndexed(this.mBody.count, 2);
    rp.setPipeline(mirror ? this.pWheelM : this.pWheel);
    rp.setVertexBuffer(0, this.mWheel.vb);
    rp.setVertexBuffer(1, this.instWheel);
    rp.setIndexBuffer(this.mWheel.ib, "uint32");
    rp.drawIndexed(this.mWheel.count, 4);
    rp.setVertexBuffer(0, this.mCal.vb);
    rp.setVertexBuffer(1, this.instCal);
    rp.setIndexBuffer(this.mCal.ib, "uint32");
    rp.drawIndexed(this.mCal.count, 4);
  },
  draw(eng, rp) {
    const off = qs.get("off") || "";
    if (!off.includes("car")) this.drawCar(rp, false);
    rp.setBindGroup(0, this.bgMain);
    if (!off.includes("sky")) {
      rp.setPipeline(this.pSky);
      rp.draw(3);
    }
    if (!off.includes("road")) {
      rp.setPipeline(this.pGround);
      rp.draw(6);
    }
  }
};
boot(scene);

</script>
</body>
